# render-demo.yaml
# DEMO / STAGING blueprint — completely separate from the production render.yaml.
# Deploy this via: Render Dashboard > New Blueprint > point to this file.
# This spins up: carton-costing-demo-api + carton-costing-demo-app + a throwaway DB.
# The demo DB is seeded with fake data only — zero client data.

services:
  # SERVICE 1: Flask/Gunicorn Backend API (Demo)
  - type: web
    name: carton-costing-demo-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app_production:app --bind 0.0.0.0:10000 --workers 2 --timeout 120 --preload
    plan: free
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: carton-costing-demo-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://carton-costing-demo-app.onrender.com

  # SERVICE 2: React/Vite Frontend (Demo Static Site)
  - type: web
    name: carton-costing-demo-app
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    envVars:
      - key: VITE_API_URL
        value: https://carton-costing-demo-api.onrender.com
      - key: VITE_DEMO_MODE
        value: "true"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# Throwaway PostgreSQL database — seeded with fake demo data, no client info
databases:
  - name: carton-costing-demo-db
    databaseName: carton_costing_demo
    plan: free
