version: '3.9'

services:

  # ── Flask/Gunicorn API Backend ─────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carton_costing_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:////app/data/carton_costing.db
      - JWT_SECRET_KEY=change-me-to-a-secure-random-string-in-prod
    volumes:
      # Persist the SQLite database between container restarts
      - db_data:/app/data
    networks:
      - app_network
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:5000/api/system-params")']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── React/Nginx Frontend ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: carton_costing_frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network

# ── Named Volumes ────────────────────────────────────────────────
volumes:
  db_data:
    driver: local

# ── Shared Internal Network ──────────────────────────────────────
networks:
  app_network:
    driver: bridge
